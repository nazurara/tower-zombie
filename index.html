<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tower Zombie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Lilita+One&display=swap" rel="stylesheet">
  <style>
    html, body { margin: 0; height: 100%; background: radial-gradient(circle at 50% 30%, #23264f, #0b0c1d); overflow: hidden; }
    #game { width: 100%; height: 100%; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #ffd166; font: 28px "Lilita One", Arial, sans-serif; letter-spacing: 2px; }
    canvas { border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
  </style>
</head>
<body>
  <div id="loading">Memuat Tower Zombie...</div>
  <div id="game"></div>
  <!-- Phaser dari CDN; kalau offline pakai salinan lokal di folder lib/ -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <script>window.Phaser || document.write('<script src="lib/phaser.min.js"><\/script>');</script>
  <script src="src/config.js"></script>
  <script src="src/perks.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/art.js"></script>
  <script src="src/ui/Button.js"></script>
  <script src="src/ui/Sidebar.js"></script>
  <script src="src/objects/Effects.js"></script>
  <script src="src/objects/Zombie.js"></script>
  <script src="src/objects/Tower.js"></script>
  <script src="src/objects/Projectile.js"></script>
  <script src="src/objects/WaveManager.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>
  <script src="src/scenes/GameOverScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
